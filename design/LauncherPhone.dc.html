<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:940},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;live&quot;,&quot;ring&quot;,&quot;search&quot;,&quot;app&quot;],&quot;default&quot;:&quot;live&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const IC = {
  camera:   { bg:'#3f6fb5', r1:'50%', c1:'#fff', w1:'46%', h1:'46%', two:true, r2:'50%', c2:'#3f6fb5', w2:'20%', h2:'20%', t2:'none' },

  chrome:   { bg:'#e0563f', r1:'50%', c1:'#fff', w1:'50%', h1:'50%', two:true, r2:'50%', c2:'#3f6fb5', w2:'22%', h2:'22%', t2:'none' },
  gmail:    { bg:'#d93025', r1:'12%', c1:'#fff', w1:'52%', h1:'36%', two:true, r2:'2px', c2:'#d93025', w2:'52%', h2:'3px', t2:'rotate(18deg)' },

  signal:   { bg:'#3a76f0', r1:'40%', c1:'#fff', w1:'46%', h1:'46%', two:true, r2:'0', c2:'#fff', w2:'14%', h2:'14%', t2:'translate(-10px,10px) rotate(45deg)' },
  photos:   { bg:'#f5b301', r1:'50%', c1:'#fff', w1:'26%', h1:'26%', t1:'translate(-8px,-7px)', two:true, r2:'3px', c2:'#fff', w2:'26%', h2:'26%', t2:'translate(7px,8px) rotate(45deg)' },
  settings: { bg:'#6b6f76', r1:'14%', c1:'#fff', w1:'44%', h1:'44%', two:true, r2:'50%', c2:'#6b6f76', w2:'18%', h2:'18%', t2:'none' },
  clock:    { bg:'#e8e3dc', r1:'50%', c1:'#1c1a19', w1:'46%', h1:'46%', two:true, r2:'99px', c2:'#e8e3dc', w2:'3px', h2:'16%', t2:'translateY(-4px)' },
  calc:     { bg:'#2f3336', r1:'10%', c1:'#f2a03d', w1:'44%', h1:'44%' },
  calendar: { bg:'#f4f2ee', r1:'10%', c1:'#d93025', w1:'46%', h1:'22%', t1:'translateY(-9px)' },
  files:    { bg:'#3f7de0', r1:'10%', c1:'#fff', w1:'46%', h1:'34%' },
  messages: { bg:'#1e9e63', r1:'40%', c1:'#fff', w1:'46%', h1:'40%' },
  phone:    { bg:'#1a8f4c', r1:'30%', c1:'#fff', w1:'40%', h1:'40%', t1:'rotate(30deg)' },
  notes:    { bg:'#f0c419', r1:'8%', c1:'#fff', w1:'44%', h1:'44%' },
  podcasts: { bg:'#8b5cf6', r1:'50%', c1:'#fff', w1:'26%', h1:'26%' },
  weather:  { bg:'#3fa2d9', r1:'50%', c1:'#fff', w1:'36%', h1:'36%' },
  wallet:   { bg:'#1c1a19', r1:'10%', c1:'#e8e3dc', w1:'46%', h1:'30%' },
  youtube:  { bg:'#e02f2f', r1:'2px', c1:'#fff', w1:'22%', h1:'26%', t1:'skewX(-0deg)' },
  ytmusic:  { bg:'#e02f2f', r1:'50%', c1:'#fff', w1:'50%', h1:'50%', two:true, r2:'50%', c2:'#e02f2f', w2:'22%', h2:'22%', t2:'none' },
  telegram: { bg:'#33a2dd', r1:'2px', c1:'#fff', w1:'40%', h1:'26%', t1:'skewX(-18deg)' },
  instagram:{ bg:'#c9337a', r1:'34%', c1:'#fff', w1:'44%', h1:'44%', two:true, r2:'50%', c2:'#c9337a', w2:'18%', h2:'18%', t2:'none' },
  whatsapp: { bg:'#25d366', r1:'40%', c1:'#fff', w1:'44%', h1:'40%' },
  strava:   { bg:'#f25f28', r1:'2px', c1:'#fff', w1:'34%', h1:'20%', t1:'skewX(20deg)' },
  kindle:   { bg:'#2b3a4a', r1:'4%', c1:'#e8e3dc', w1:'40%', h1:'46%' },
  slack:    { bg:'#4a154b', r1:'99px', c1:'#fff', w1:'44%', h1:'12%' },
};

const APPS = [
  ['Camera','camera','cam photo'], ['Maps','maps','navigation nav'], ['Chrome','chrome','browser web'],
  ['Gmail','gmail','mail email'], ['Spotify','spotify','music'], ['Signal','signal','messages secure'],
  ['Photos','photos','gallery pictures'], ['Settings','settings','preferences system'],
  ['Clock','clock','alarm timer'], ['Calculator','calc','calc math'], ['Calendar','calendar','agenda'],
  ['Files','files','storage'], ['Messages','messages','sms texts'], ['Phone','phone','dialer call'],
  ['Notes','notes','memo'], ['Podcasts','podcasts','audio shows'], ['Weather','weather','forecast'],
  ['Wallet','wallet','pay cards'], ['YouTube','youtube','yt video'], ['YouTube Music','ytmusic','ytm music'],
  ['Telegram','telegram','tg chat'], ['Instagram','instagram','ig photos'], ['WhatsApp','whatsapp','wa chat'],
  ['Strava','strava','running cycling'], ['Kindle','kindle','books reading'], ['Slack','slack','work chat'],
];

const RING = ['Camera','Maps','Chrome','Gmail','Spotify','Signal','Photos','Settings'];
const POS = ['N','NE','E','SE','S','SW','W','NW'];
const W = 396, H = 876, R = 104, MARGIN = 142, PAD = 62;
const LETTERS = ['c','l','k','s','a','m','e','r'];

function icon(key) { const b = IC[key] || IC.notes; return Object.assign({ t1:'none', two:false, r2:'0', c2:'#fff', w2:'0', h2:'0', t2:'none' }, b); }
function appObj(a) { return Object.assign({ name:a[0], key:a[1], alias:a[2] }, icon(a[1])); }

function score(app, q) {
  const hay = (app.name + ' ' + app.alias).toLowerCase();
  let i = 0, runs = 0, bounds = 0, last = -2;
  for (const ch of q) {
    const at = hay.indexOf(ch, i);
    if (at < 0) return null;
    if (at === last + 1) runs++;
    if (at === 0 || hay[at - 1] === ' ') bounds++;
    last = at; i = at + 1;
  }
  return bounds * 100 + runs * 10 - app.name.length * 0.1;
}

class Component extends DCLogic {
  state = { touched:false, ring:null, ringIn:false, query:'', searchOpen:false, searchIn:false, playing:true, page:0, reject:0, pts:[], strokeOn:false, letterIx:0 };

  seed() {
    if (this.state.touched) return;
    const m = this.props.mode || 'live';
    const s = { touched:true };
    if (m === 'ring') { s.ring = { x:198, y:470 }; s.ringIn = true; s.playing = false; }
    if (m === 'search') { s.query = 'cl'; s.searchOpen = true; s.searchIn = true; s.letterIx = 2; }
    this.setState(s);
  }

  openRing(x, y) {
    if (x < MARGIN || x > W - MARGIN || y < MARGIN || y > H - MARGIN) { this.setState(s => ({ reject: s.reject + 1 })); return; }
    this.setState({ ring:{ x, y }, ringIn:false });
    requestAnimationFrame(() => requestAnimationFrame(() => this.setState({ ringIn:true })));
  }

  addLetter() {
    this.setState(s => {
      const ch = LETTERS[s.letterIx % LETTERS.length];
      const q = s.query + ch;
      return { query:q, letterIx:s.letterIx + 1, searchOpen:true, page:0 };
    });
    requestAnimationFrame(() => this.setState({ searchIn:true }));
  }

  backspace() {
    this.setState(s => {
      const q = s.query.slice(0, -1);
      return { query:q, letterIx:Math.max(0, s.letterIx - 1), searchOpen:q.length > 0, searchIn:q.length > 0, page:0 };
    });
  }

  renderVals() {
    const st = this.state;
    const mode = this.props.mode || 'live';
    let ring = st.ring, ringIn = st.ringIn, qRaw = st.query, searchOpen = st.searchOpen, searchIn = st.searchIn;
    let play = st.playing;
    if (!st.touched) {
      if (mode === 'ring') { ring = { x:198, y:470 }; ringIn = true; play = false; }
      if (mode === 'search') { qRaw = 'cl'; searchOpen = true; searchIn = true; }
    }
    const ringItems = [];
    if (ring) {
      const f = ringIn ? 1 : 0.12;
      RING.forEach((name, i) => {
        const ang = (-90 + i * 45) * Math.PI / 180;
        const a = APPS.find(x => x[0] === name);
        ringItems.push(Object.assign(appObj(a), {
          left: ring.x + Math.cos(ang) * R * f - PAD / 2,
          top:  ring.y + Math.sin(ang) * R * f - PAD / 2,
          t: ringIn ? 'scale(1)' : 'scale(.4)',
          delay: (i * 14) + 'ms',
        }));
      });
    }

    const q = qRaw.toLowerCase();
    let matched = APPS.map(appObj);
    if (q) {
      matched = matched.map(a => ({ a, s: score(a, q) })).filter(x => x.s !== null)
        .sort((x, y) => y.s - x.s).map(x => x.a);
    }
    const perPage = 8;
    const pageCount = Math.max(1, Math.ceil(matched.length / perPage));
    const page = Math.min(st.page, pageCount - 1);
    const results = matched.slice(page * perPage, page * perPage + perPage);
    const pages = Array.from({ length: pageCount }, (_, i) => ({ o: i === page ? 1 : 0.28 }));

    return {
      isHome: mode !== 'app',
      isApp: mode === 'app',
      playing: play,
      idle: !play,
      track: 'Says — Nils Frahm',
      badges: [
        Object.assign(icon('telegram'), { count:3 }),
        Object.assign(icon('instagram'), { count:12 }),
        Object.assign(icon('whatsapp'), { count:1 }),
      ],
      ringItems,
      ringOpacity: ring ? 1 : 0,
      ringCx: ring ? ring.x - 26 : -100,
      ringCy: ring ? ring.y - 26 : -100,
      ringCenterT: ringIn ? 'scale(1)' : 'scale(.5)',
      rejectAnim: st.reject ? 'hbpulse .5s ease-out ' + st.reject : 'none',
      query: qRaw,
      results,
      pages,
      resultCount: matched.length + (matched.length === 1 ? ' result' : ' results'),
      searchDisplay: searchOpen ? 'flex' : 'none',
      searchOpacity: searchIn ? 1 : 0,
      strokePts: st.pts.map(p => p.x + ',' + p.y).join(' '),
      strokeOpacity: st.strokeOn ? 0.85 : 0,

      toggleMusic: (e) => { e.stopPropagation(); this.seed(); this.setState(s => ({ playing: !s.playing })); },
      dismissRing: (e) => { e.stopPropagation(); this.setState({ touched:true, ring, ringIn:false }); setTimeout(() => this.setState({ ring:null }), 180); },

      onDown: (e) => {
        this.seed();
        const r = e.currentTarget.getBoundingClientRect();
        const sc = r.width / W;
        this._p = { x:(e.clientX - r.left) / sc, y:(e.clientY - r.top) / sc, moved:false };
        this.setState({ pts:[{ x:this._p.x, y:this._p.y }], strokeOn:true });
      },
      onMove: (e) => {
        if (!this._p) return;
        const r = e.currentTarget.getBoundingClientRect();
        const sc = r.width / W;
        const x = (e.clientX - r.left) / sc, y = (e.clientY - r.top) / sc;
        if (Math.abs(x - this._p.x) > 10 || Math.abs(y - this._p.y) > 10) this._p.moved = true;
        this._p.lx = x; this._p.ly = y;
        this.setState(s => ({ pts: s.pts.concat([{ x, y }]) }));
      },
      onUp: () => {
        const p = this._p; this._p = null;
        if (!p) return;
        setTimeout(() => this.setState({ strokeOn:false }), 260);
        if (!p.moved) {
          if (searchOpen) return;
          if (ring) { this.setState({ ringIn:false }); setTimeout(() => this.setState({ ring:null }), 180); return; }
          this.openRing(p.x, p.y);
          return;
        }
        const dx = (p.lx || p.x) - p.x, dy = (p.ly || p.y) - p.y;
        if (dx < -60 && Math.abs(dy) < 45 && p.x < W - 24) { this.backspace(); return; }
        this.addLetter();
      },

      appSections: [
        { title:'Ring bindings', rows: RING.map((n, i) => ({ k:POS[i], v:n, c:'#f4efe9' })) },
        { title:'Home block', rows: [
          { k:'badge 1', v:'Telegram', c:'#f4efe9' },
          { k:'badge 2', v:'Instagram', c:'#f4efe9' },
          { k:'badge 3', v:'WhatsApp', c:'#f4efe9' },
          { k:'music', v:'YouTube Music', c:'#f4efe9' },
          { k:'link', v:'YouTube', c:'#f4efe9' },
        ] },
        { title:'Permissions', rows: [
          { k:'notification listener', v:'live', c:'#8fd6a6' },
          { k:'media session', v:'live', c:'#8fd6a6' },
          { k:'usage stats', v:'denied', c:'#f0906f' },
        ] },
        { title:'Graffiti', rows: [
          { k:'alphabet', v:'26 strokes, v0', c:'#f4efe9' },
          { k:'backspace', v:'swipe left, not from edge', c:'#f4efe9' },
          { k:'matching', v:'subsequence, then edit distance', c:'#f4efe9' },
        ] },
        { title:'Contextual rules', rows: [
          { k:'01', v:'recency, last 24 hours', c:'#f4efe9' },
          { k:'02', v:'time of day cohort', c:'#f4efe9' },
          { k:'03', v:'unread notifications', c:'#f4efe9' },
          { k:'04', v:'not yet defined', c:'#a89c93' },
        ] },
        { title:'Diagnostics', rows: [
          { k:'strokes undone', v:'29 of 412', c:'#f0906f' },
          { k:'worst letter', v:'s, 14 undone', c:'#f0906f' },
          { k:'rings dismissed', v:'23 of 214', c:'#f4efe9' },
          { k:'taps rejected at edge', v:'41', c:'#f4efe9' },
        ] },
        { title:'Build', rows: [
          { k:'version', v:'0.4.2', c:'#f4efe9' },
          { k:'built', v:'14 Aug 2026', c:'#f4efe9' },
          { k:'commit', v:'a7f1c39', c:'#f4efe9' },
        ] },
        { title:'App list', rows: APPS.map(a => ({ k:a[0], v:a[2], c:'#d9cfc6' })) },
      ],
    };
  }
}
</script>
